name: Deploy Next.js Frontend to Namecheap
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CPANEL_HOST }}
          port: 21098
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          script: |
            source /home/neexdstq/nodevenv/jorsastech.com/20/bin/activate
            cd ${{ secrets.CPANEL_FRONTEND_PATH }}
            git pull origin main
            npm install --legacy-peer-deps --include=dev
            NEXT_PUBLIC_PUSHER_KEY=${{ secrets.NEXT_PUBLIC_PUSHER_KEY }} \
            NEXT_PUBLIC_PUSHER_CLUSTER=${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }} \
            npm run build
            mkdir -p tmp && touch tmp/restart.txt
